name: Mock Tests

on:
  push:
    branches: [ "main", "master", "ina238-mock-test" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'imgs/**'
      - 'LICENSE*'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'imgs/**'
      - 'LICENSE*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Unit & Mock Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 1. Formatting Check
      - name: Check Formatting
        run: cargo fmt --check

      # 2. Linting & Static Analysis (Runs compiler checks + clippy lints)
      - name: Run Clippy [Compilation(cargo check) + Linter]
        run: cargo clippy -- -D warnings

      # 3. Test Execution
      - name: Run Unit & Mock Tests
        run: cargo test --verbose

      # - name: Build target
      #   run: cargo build
        
      # - name: Check #![no_std] Bare-Metal Compilation
      #   run: |
      #     rustup target add thumbv7em-none-eabihf
      #     cargo check --target thumbv7em-none-eabihf

      #  Optional Cleanup
      - name: Remove artifacts from target
        run: cargo clean --verbose


